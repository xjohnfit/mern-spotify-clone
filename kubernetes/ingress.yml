apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamify-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
  # Frontend - streamify.codewithxjohn.com
  - host: streamify.codewithxjohn.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: streamify-frontend
            port:
              number: 80
  # Frontend - www.streamify.codewithxjohn.com
  - host: www.streamify.codewithxjohn.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: streamify-frontend
            port:
              number: 80
  # Backend API - api.streamify.codewithxjohn.com
  - host: api.streamify.codewithxjohn.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: streamify-backend
            port:
              number: 5000  # YOUR_BACKEND_PORT
  # Backend API - www.api.streamify.codewithxjohn.com
  - host: www.api.streamify.codewithxjohn.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: streamify-backend
            port:
              number: 5000  # YOUR_BACKEND_PORT
  tls:
  - hosts:
    - streamify.codewithxjohn.com
    - www.streamify.codewithxjohn.com
    - api.streamify.codewithxjohn.com
    - www.api.streamify.codewithxjohn.com
    secretName: streamify-tls